<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            position: relative;
        }
        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .heart {
            font-size: 50px;
            animation: beat 1s infinite alternate;
            margin-bottom: 15px;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }
        #noBtn {
            background-color: #70a1ff;
            color: white;
            position: absolute;
        }
        .success-message {
            display: none;
        }
        .success-message h2 {
            color: #ff4757;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Card Section -->
        <div id="proposalCard">
            <div class="heart">❤️</div>
            <h1>Will You Be Mine Forever?</h1>
            <p>Aapki muskaan meri duniya roshan karti hai. Every moment with you feels like a beautiful dream.</p>
            
            <div class="btn-container">
                <button id="yesBtn" onclick="acceptProposal()">Yes! 💖</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
            </div>
        </div>

        <!-- Success Message (Visible after clicking Yes) -->
        <div id="successCard" class="success-message">
            <div class="heart">🎉💖✨</div>
            <h2>I Love You!</h2>
            <p>Mujhe pata tha aap 'Yes' hi kahogi! 🥰<br>Thank you for making my life so special!</p>
        </div>
    </div>

    <script>
        // "No" button movement logic
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate safe bounds within container
            const maxX = containerRect.width - btnRect.width - 40;
            const maxY = containerRect.height - btnRect.height - 40;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // "Yes" button click logic
        function acceptProposal() {
            document.getElementById('proposalCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }
    </script>
</body>
</html>
